<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV Metadata Review | HICAREER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav">
        <a class="brand" href="index.html"><span class="brand-mark">HI</span><span>HICAREER</span></a>
        <div class="nav-links">
          <a href="index.html">홈</a>
          <a class="active" href="diagnosis.html">CV 진단</a>
          <a href="report.html">리포트</a>
          <a href="opportunities.html">추천 활동</a>
          <a href="plan.html">성장 플랜</a>
        </div>
        <a class="nav-cta" href="diagnosis.html">새 분석</a>
      </nav>
    </header>
    <main class="page-shell">
      <section class="page-title">
        <span class="eyebrow">Phase 1</span>
        <h1>CV를 확인 가능한 metadata로 정리합니다</h1>
        <p>PDF를 업로드하고 목표 직무와 준비 기간을 입력한 뒤, 추출된 항목을 직접 검토·수정·확정하세요.</p>
      </section>
      <section class="diagnosis-panel">
        <form id="workflowForm" class="question-grid">
          <label>목표 직무<input id="preferredRole" name="preferred_role" required placeholder="예: AI Engineer, Frontend Developer" /></label>
          <label>준비 기간<input id="preparationPeriod" name="preparation_period" required placeholder="예: 8주, 3개월" /></label>
          <label>추가 정보<textarea id="additionalInformation" name="additional_information" placeholder="CV에 없지만 분석에 반영할 정보가 있다면 입력하세요."></textarea></label>
          <label class="upload-box" for="cvFile">
            <input id="cvFile" name="cv_file" type="file" accept="application/pdf,.pdf" required />
            <span class="upload-icon">PDF</span>
            <strong id="fileName">CV PDF를 선택하세요</strong>
            <small>PDF만 지원합니다. 원문은 추적성을 위해 보존되며, 분석 전 metadata를 확인합니다.</small>
          </label>
          <button class="button primary full" type="submit" id="extractButton">PDF 추출 및 metadata 생성</button>
        </form>
        <div id="statusCard" class="result-card">
          <span class="result-label">상태</span>
          <h3 id="statusTitle">PDF를 업로드하면 검토 화면이 표시됩니다.</h3>
          <p id="statusText">추출 결과는 확정 전까지 downstream 분석에 사용되지 않습니다.</p>
        </div>
        <section id="reviewSection" class="hidden">
          <div class="section-heading between">
            <div>
              <span class="eyebrow">Metadata Review</span>
              <h2>추출된 정보를 확인하세요</h2>
              <p>각 항목의 출처와 provenance를 확인하고 잘못된 항목은 수정하거나 삭제하세요.</p>
            </div>
            <span id="revisionLabel" class="job-source"></span>
          </div>
          <div id="metadataPreferences" class="result-card"></div>
          <div id="metadataGroups" class="stacked-cards"></div>
          <div id="discussionPanel" class="orchestration-panel hidden"></div>
          <form id="addItemForm" class="result-card question-grid">
            <h3>누락된 정보 추가</h3>
            <label>카테고리<select id="newCategory">
              <option value="activities_and_career_experience">Activities and career experience</option>
              <option value="awards">Awards</option>
              <option value="leadership_and_contribution">Leadership and contribution</option>
              <option value="volunteering_and_contribution">Volunteering and contribution</option>
              <option value="language_proficiency">Language proficiency</option>
              <option value="certifications_and_credentials">Certifications and credentials</option>
              <option value="projects">Projects</option>
              <option value="research">Research</option>
              <option value="technical_skills">Technical skills</option>
              <option value="education_and_training">Education and training</option>
              <option value="additional_information">Additional information</option>
            </select></label>
            <label>내용<textarea id="newValue" required placeholder="사용자가 직접 제공하는 내용을 입력하세요."></textarea></label>
            <button class="button secondary" type="submit">항목 추가</button>
          </form>
          <button class="button primary full" id="confirmButton" type="button">확정하고 다음 단계로 이동</button>
        </section>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
